<text x="308.2" y="424.0" font-size="11" fill="#444444" text-anchor="middle">10</text>
<line x1="538.4" y1="56" x2="538.4" y2="406" stroke="#e6e6e6"/>
<text x="538.4" y="424.0" font-size="11" fill="#444444" text-anchor="middle">100</text>
