<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="880" height="470" fill="white"/>
<text x="78" y="26" font-size="17" font-weight="700" fill="#222222">Control bytes vs difference size  (collection fixed at 500 docs, real nodes)</text>
<text x="78" y="44" font-size="12" fill="#666">Reconciliation is O(diff·log n) — it grows with the number of changed docs; default broadcast is O(n), flat in the diff. They cross when the diff gets large.</text>
