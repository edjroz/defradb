<text x="70" y="358.2" font-size="11" fill="#444444" text-anchor="end">10B</text>
<line x1="78" y1="272.4" x2="660" y2="272.4" stroke="#e6e6e6"/>
<text x="70" y="276.4" font-size="11" fill="#444444" text-anchor="end">100B</text>
<line x1="78" y1="190.6" x2="660" y2="190.6" stroke="#e6e6e6"/>
<text x="70" y="194.6" font-size="11" fill="#444444" text-anchor="end">1.0KB</text>
<line x1="78" y1="108.8" x2="660" y2="108.8" stroke="#e6e6e6"/>
<text x="70" y="112.8" font-size="11" fill="#444444" text-anchor="end">10KB</text>
<line x1="78" y1="86" x2="78" y2="436" stroke="#444444"/>
<line x1="78" y1="436" x2="660" y2="436" stroke="#444444"/>
<text x="20" y="261" font-size="12" fill="#222222" text-anchor="middle" transform="rotate(-90 20 261)">control bytes (log scale)</text>
<rect x="110.7" y="220.6" width="80.0" height="215.4" fill="#d1495b"/>
<text x="150.8" y="213.6" font-size="12" font-weight="600" fill="#d1495b" text-anchor="middle">429B</text>
<text x="150.8" y="454.0" font-size="11" fill="#222222" text-anchor="middle">default sync</text>
<text x="150.8" y="468.0" font-size="11" fill="#222222" text-anchor="middle">k=3</text>
<rect x="256.2" y="220.6" width="80.0" height="215.4" fill="#d1495b"/>
