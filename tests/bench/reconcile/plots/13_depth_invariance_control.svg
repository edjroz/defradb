<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="880" height="480" fill="white"/>
<text x="78" y="26" font-size="17" font-weight="700" fill="#222222">Control cost is invariant to branch depth (10-doc fork, real nodes)</text>
<text x="78" y="44" font-size="12" fill="#666">Branches 16x deeper (k=3 -&gt; k=50) leave control bytes unchanged; only the payload scales (chart 14). Log scale.</text>
<line x1="78" y1="416.0" x2="660" y2="416.0" stroke="#e6e6e6"/>
<text x="70" y="420.0" font-size="11" fill="#444444" text-anchor="end">1B</text>
<line x1="78" y1="337.0" x2="660" y2="337.0" stroke="#e6e6e6"/>
<text x="70" y="341.0" font-size="11" fill="#444444" text-anchor="end">10B</text>
<line x1="78" y1="258.0" x2="660" y2="258.0" stroke="#e6e6e6"/>
<text x="70" y="262.0" font-size="11" fill="#444444" text-anchor="end">100B</text>
<line x1="78" y1="179.0" x2="660" y2="179.0" stroke="#e6e6e6"/>
<text x="70" y="183.0" font-size="11" fill="#444444" text-anchor="end">1.0KB</text>
<line x1="78" y1="100.0" x2="660" y2="100.0" stroke="#e6e6e6"/>
<text x="70" y="104.0" font-size="11" fill="#444444" text-anchor="end">10KB</text>
<line x1="78" y1="78" x2="78" y2="416" stroke="#444444"/>
<line x1="78" y1="416" x2="660" y2="416" stroke="#444444"/>
<text x="20" y="247" font-size="12" fill="#222222" text-anchor="middle" transform="rotate(-90 20 247)">control bytes (log scale)</text>
<rect x="110.7" y="208.0" width="80.0" height="208.0" fill="#d1495b"/>
<text x="150.8" y="201.0" font-size="12" font-weight="600" fill="#d1495b" text-anchor="middle">429B</text>
<text x="150.8" y="434.0" font-size="11" fill="#222222" text-anchor="middle">default sync</text>
<text x="150.8" y="448.0" font-size="11" fill="#222222" text-anchor="middle">k=3</text>
<rect x="256.2" y="208.0" width="80.0" height="208.0" fill="#d1495b"/>
<text x="296.2" y="201.0" font-size="12" font-weight="600" fill="#d1495b" text-anchor="middle">429B</text>
<text x="296.2" y="434.0" font-size="11" fill="#222222" text-anchor="middle">default sync</text>
<text x="296.2" y="448.0" font-size="11" fill="#222222" text-anchor="middle">k=50</text>
