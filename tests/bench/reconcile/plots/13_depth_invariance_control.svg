<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="880" height="470" fill="white"/>
<text x="78" y="26" font-size="17" font-weight="700" fill="#222222">Control cost is invariant to branch depth (10-doc fork, real nodes)</text>
<text x="78" y="44" font-size="12" fill="#666">Branches 16x deeper (k=3 -&gt; k=50) leave control bytes unchanged; only the payload scales (chart 14). Log scale.</text>
<line x1="78" y1="406.0" x2="660" y2="406.0" stroke="#e6e6e6"/>
<text x="70" y="410.0" font-size="11" fill="#444444" text-anchor="end">1B</text>
<line x1="78" y1="324.2" x2="660" y2="324.2" stroke="#e6e6e6"/>
<text x="70" y="328.2" font-size="11" fill="#444444" text-anchor="end">10B</text>
<line x1="78" y1="242.4" x2="660" y2="242.4" stroke="#e6e6e6"/>
<text x="70" y="246.4" font-size="11" fill="#444444" text-anchor="end">100B</text>
<line x1="78" y1="160.6" x2="660" y2="160.6" stroke="#e6e6e6"/>
<text x="70" y="164.6" font-size="11" fill="#444444" text-anchor="end">1KB</text>
<line x1="78" y1="78.8" x2="660" y2="78.8" stroke="#e6e6e6"/>
<text x="70" y="82.8" font-size="11" fill="#444444" text-anchor="end">10KB</text>
<line x1="78" y1="56" x2="78" y2="406" stroke="#444444"/>
<line x1="78" y1="406" x2="660" y2="406" stroke="#444444"/>
<text x="20" y="231" font-size="12" fill="#222222" text-anchor="middle" transform="rotate(-90 20 231)">control bytes (log scale)</text>
<rect x="110.7" y="190.6" width="80.0" height="215.4" fill="#d1495b"/>
<text x="150.8" y="183.6" font-size="12" font-weight="600" fill="#d1495b" text-anchor="middle">429B</text>
<text x="150.8" y="424.0" font-size="11" fill="#222222" text-anchor="middle">default sync</text>
<text x="150.8" y="438.0" font-size="11" fill="#222222" text-anchor="middle">k=3</text>
<rect x="256.2" y="190.6" width="80.0" height="215.4" fill="#d1495b"/>
<text x="296.2" y="183.6" font-size="12" font-weight="600" fill="#d1495b" text-anchor="middle">429B</text>
<text x="296.2" y="424.0" font-size="11" fill="#222222" text-anchor="middle">default sync</text>
<text x="296.2" y="438.0" font-size="11" fill="#222222" text-anchor="middle">k=50</text>
