<text x="441.8" y="49.0" font-size="12" font-weight="600" fill="#2e86ab" text-anchor="middle">19KB</text>
<text x="441.8" y="424.0" font-size="11" fill="#222222" text-anchor="middle">reconcile</text>
<text x="441.8" y="438.0" font-size="11" fill="#222222" text-anchor="middle">k=3</text>
<rect x="547.2" y="56.0" width="80.0" height="350.0" fill="#2e86ab"/>
<text x="587.2" y="49.0" font-size="12" font-weight="600" fill="#2e86ab" text-anchor="middle">19KB</text>
