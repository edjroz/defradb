<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="880" height="500" fill="white"/>
<text x="78" y="26" font-size="17" font-weight="700" fill="#222222">Control cost is invariant to branch depth (10-doc fork, real nodes)</text>
<text x="78" y="44" font-size="12" fill="#666">Branches 16x deeper (k=3 -&gt; k=50) leave control bytes unchanged; only the payload scales (chart 14). Log</text>
<text x="78" y="59" font-size="12" fill="#666">scale.</text>
<line x1="78" y1="436.0" x2="660" y2="436.0" stroke="#e6e6e6"/>
<text x="70" y="440.0" font-size="11" fill="#444444" text-anchor="end">1B</text>
