<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="880" height="500" fill="white"/>
<text x="78" y="26" font-size="17" font-weight="700" fill="#222222">Local write cost with reconciliation off vs on (real node)</text>
<text x="78" y="44" font-size="12" fill="#666">Seeding 50 docs x 5 updates; the extra per-commit ordered-index write adds ~5%.</text>
<line x1="78" y1="436.0" x2="660" y2="436.0" stroke="#e6e6e6"/>
<text x="70" y="440.0" font-size="11" fill="#444444" text-anchor="end">0ms</text>
<line x1="78" y1="366.0" x2="660" y2="366.0" stroke="#e6e6e6"/>
<text x="70" y="370.0" font-size="11" fill="#444444" text-anchor="end">16ms</text>
<line x1="78" y1="296.0" x2="660" y2="296.0" stroke="#e6e6e6"/>
<text x="70" y="300.0" font-size="11" fill="#444444" text-anchor="end">32ms</text>
<line x1="78" y1="226.0" x2="660" y2="226.0" stroke="#e6e6e6"/>
<text x="70" y="230.0" font-size="11" fill="#444444" text-anchor="end">48ms</text>
<line x1="78" y1="156.0" x2="660" y2="156.0" stroke="#e6e6e6"/>
<text x="70" y="160.0" font-size="11" fill="#444444" text-anchor="end">64ms</text>
<line x1="78" y1="86.0" x2="660" y2="86.0" stroke="#e6e6e6"/>
<text x="70" y="90.0" font-size="11" fill="#444444" text-anchor="end">80ms</text>
<line x1="78" y1="86" x2="78" y2="436" stroke="#444444"/>
<line x1="78" y1="436" x2="660" y2="436" stroke="#444444"/>
<text x="20" y="261" font-size="12" fill="#222222" text-anchor="middle" transform="rotate(-90 20 261)">write time per op (ms, lower is better)</text>
<rect x="143.5" y="101.4" width="160.1" height="334.6" fill="#d1495b"/>
<text x="223.5" y="94.4" font-size="12" font-weight="600" fill="#d1495b" text-anchor="middle">76ms</text>
<text x="223.5" y="454.0" font-size="11" fill="#222222" text-anchor="middle">reconciliation off</text>
<rect x="434.5" y="86.0" width="160.1" height="350.0" fill="#2e86ab"/>
<text x="514.5" y="79.0" font-size="12" font-weight="600" fill="#2e86ab" text-anchor="middle">80ms</text>
<text x="514.5" y="454.0" font-size="11" fill="#222222" text-anchor="middle">reconciliation on</text>
</svg>