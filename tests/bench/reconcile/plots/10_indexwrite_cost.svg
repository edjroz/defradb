<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="880" height="480" fill="white"/>
<text x="78" y="26" font-size="17" font-weight="700" fill="#222222">Local write cost with reconciliation off vs on (real node)</text>
<text x="78" y="44" font-size="12" fill="#666">Seeding 50 docs x 5 updates; the extra per-commit ordered-index write adds ~5%.</text>
<line x1="78" y1="416.0" x2="660" y2="416.0" stroke="#e6e6e6"/>
<text x="70" y="420.0" font-size="11" fill="#444444" text-anchor="end">0ms</text>
<line x1="78" y1="348.4" x2="660" y2="348.4" stroke="#e6e6e6"/>
<text x="70" y="352.4" font-size="11" fill="#444444" text-anchor="end">16ms</text>
<line x1="78" y1="280.8" x2="660" y2="280.8" stroke="#e6e6e6"/>
<text x="70" y="284.8" font-size="11" fill="#444444" text-anchor="end">32ms</text>
<line x1="78" y1="213.2" x2="660" y2="213.2" stroke="#e6e6e6"/>
<text x="70" y="217.2" font-size="11" fill="#444444" text-anchor="end">48ms</text>
<line x1="78" y1="145.6" x2="660" y2="145.6" stroke="#e6e6e6"/>
<text x="70" y="149.6" font-size="11" fill="#444444" text-anchor="end">64ms</text>
<line x1="78" y1="78.0" x2="660" y2="78.0" stroke="#e6e6e6"/>
<text x="70" y="82.0" font-size="11" fill="#444444" text-anchor="end">80ms</text>
<line x1="78" y1="78" x2="78" y2="416" stroke="#444444"/>
<line x1="78" y1="416" x2="660" y2="416" stroke="#444444"/>
<text x="20" y="247" font-size="12" fill="#222222" text-anchor="middle" transform="rotate(-90 20 247)">write time per op (ms, lower is better)</text>
<rect x="143.5" y="92.9" width="160.1" height="323.1" fill="#d1495b"/>
<text x="223.5" y="85.9" font-size="12" font-weight="600" fill="#d1495b" text-anchor="middle">76ms</text>
<text x="223.5" y="434.0" font-size="11" fill="#222222" text-anchor="middle">reconciliation off</text>
<rect x="434.5" y="78.0" width="160.1" height="338.0" fill="#2e86ab"/>
<text x="514.5" y="71.0" font-size="12" font-weight="600" fill="#2e86ab" text-anchor="middle">80ms</text>
<text x="514.5" y="434.0" font-size="11" fill="#222222" text-anchor="middle">reconciliation on</text>
</svg>